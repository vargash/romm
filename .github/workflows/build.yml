name: Build Personal Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag to use (e.g., test, v1.0, feature-name)'
        required: true
        default: 'test'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.3.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata (slim)
        id: meta-slim
        uses: docker/metadata-action@v5.8.0
        with:
          images: |
            name=ghcr.io/vargash/romm
          flavor: |
            suffix=-slim,onlatest=true
          tags: |
            type=raw,value=${{ github.event.inputs.tag }}
          labels: |
            org.opencontainers.image.title="vargash/romm"
            org.opencontainers.image.description="Personal build of RomM (ROM Manager)"
            org.opencontainers.image.licenses="AGPLv3"

      - name: Generate Docker metadata (full)
        id: meta
        uses: docker/metadata-action@v5.8.0
        with:
          images: |
            name=ghcr.io/vargash/romm
          tags: |
            type=raw,value=${{ github.event.inputs.tag }}
          labels: |
            org.opencontainers.image.title="vargash/romm"
            org.opencontainers.image.description="Personal build of RomM (ROM Manager)"
            org.opencontainers.image.licenses="AGPLv3"

      - name: Set version
        run: |
          sed -i 's/<version>/${{ github.event.inputs.tag }}/' backend/__version__.py

      - name: Build slim image
        id: build-slim
        uses: docker/build-push-action@v6.18.0
        with:
          file: docker/Dockerfile
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          target: slim-image

      - name: Build full image
        id: build-full
        uses: docker/build-push-action@v6.18.0
        with:
          file: docker/Dockerfile
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: full-image